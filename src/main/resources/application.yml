server:
  port: 8080
  # 用户代码可能跑很久，给足等待时间；真正的超时由 executor.*-timeout-ms 控制
  tomcat:
    connection-timeout: 30s

spring:
  application:
    name: code-executor
  # 语言配置单独放一个文件，加语言不用改代码
  config:
    import: classpath:languages.yml
  mvc:
    problemdetails:
      enabled: false

executor:
  # 运行用户代码的镜像（由本仓库根目录的 Dockerfile 构建）
  image: code-executor-runner:1
  # true = 只打印"将会下发的 docker 命令"，不真正执行。
  # 适合：本机没装 Docker、或想先看懂流程的时候。
  dry-run: false
  # 容器内运行代码的用户，必须是非 root（镜像里创建了 uid=10001）
  user: "10001:10001"
  # 单次提交的代码上限（UTF-8 字节）。多文件时是所有源文件【合计】。
  # ⚠️ 不要超过 90 KB：源码是经命令行参数（base64）传进容器的，
  #    而 Linux 单个参数上限是 128 KiB，base64 还会膨胀 1/3。
  max-code-bytes: 65536
  # 单次提交的文件数上限（含入口文件与标准输入文件）
  max-files: 16
  # 标准输入的字节上限
  max-stdin-bytes: 8192
  # stdout / stderr 各自最多回传多少字节，超出部分丢弃并标记 truncated
  max-output-bytes: 65536
  # 同时执行多少个请求，超出的直接返回 429（v1 不做排队）
  max-concurrent-executions: 4
  # 容器工作目录（tmpfs）与 /tmp 的大小
  workspace-size-mb: 64
  tmp-size-mb: 16
  # 容器"保命"时长 = 编译超时 + 运行超时 + 这个余量（秒）
  # 作用：即使执行器进程崩了，容器也会自己退出，不会永久泄漏
  container-lifetime-slack-seconds: 30
  docker:
    # 留空 = 走 DOCKER_HOST 环境变量或默认 socket
    # Linux/macOS: unix:///var/run/docker.sock   Windows: npipe:////./pipe/docker_engine
    host: ""
    connect-timeout-seconds: 10
    # 留得比"最长的一次容器操作"更长
    response-timeout-seconds: 120
    max-connections: 32
  reaper:
    # 定时清理"漏网"的容器（执行器崩了、断电了、killed 了都可能留下）
    enabled: true
    interval-millis: 60000
    # 创建后多久才允许被回收，避免误杀正在跑的容器
    grace-seconds: 120

  # ============================================================
  # API Key 鉴权 —— 默认开启
  # ------------------------------------------------------------
  # 为什么默认开启：执行器持有 Docker socket，等价于宿主机 root。
  # 一个没有鉴权的执行器只要被人访问到，就等于把机器交出去。
  #
  # 没有配置任何 key 时应用会【启动失败】。这是刻意的：
  # 静默地降级成不鉴权，比明显的启动失败危险得多。
  #
  # 配置方式（推荐用环境变量，不要写进这个文件，更不要提交到 git）：
  #     EXECUTOR_AUTH_KEYS_0_NAME=my-app
  #     EXECUTOR_AUTH_KEYS_0_VALUE=<openssl rand -base64 32 生成的串>
  #
  # 只想本地跑着玩：
  #     --executor.auth.enabled=false
  # ============================================================
  auth:
    enabled: true
    header-name: X-API-Key
    # 健康检查必须免鉴权：负载均衡器和容器编排靠它判断实例是否存活，
    # 而它只返回 UP/DOWN，不泄露业务信息。
    public-paths:
      - /actuator/health
    # key 列表留空，全部从环境变量注入。
    # 支持多个 key 是为了让轮换可行：加新 key → 部署 → 切换调用方 → 删旧 key，全程不停机。
    keys: [ ]

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.chenchen.codeexecutor: INFO
