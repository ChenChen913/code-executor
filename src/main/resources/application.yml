server:
  port: 8080
  # 用户代码可能跑很久，给足等待时间；真正的超时由 executor.*-timeout-ms 控制
  tomcat:
    connection-timeout: 30s

spring:
  application:
    name: code-executor
  # 语言配置单独放一个文件，加语言不用改代码
  config:
    import: classpath:languages.yml
  mvc:
    problemdetails:
      enabled: false

executor:
  # 运行用户代码的镜像（由本仓库根目录的 Dockerfile 构建）
  image: code-executor-runner:1
  # true = 只打印"将会下发的 docker 命令"，不真正执行。
  # 适合：本机没装 Docker、或想先看懂流程的时候。
  dry-run: false
  # 容器内运行代码的用户，必须是非 root（镜像里创建了 uid=10001）
  user: "10001:10001"
  # 单次提交的代码上限（UTF-8 字节）。多文件时是所有源文件【合计】。
  # ⚠️ 不要超过 90 KB：源码是经命令行参数（base64）传进容器的，
  #    而 Linux 单个参数上限是 128 KiB，base64 还会膨胀 1/3。
  max-code-bytes: 65536
  # 单次提交的文件数上限（含入口文件与标准输入文件）
  max-files: 16
  # 标准输入的字节上限
  max-stdin-bytes: 8192
  # stdout / stderr 各自最多回传多少字节，超出部分丢弃并标记 truncated
  max-output-bytes: 65536
  # 同时执行多少个请求，超出的直接返回 429（v1 不做排队）
  max-concurrent-executions: 4
  # 容器工作目录（tmpfs）与 /tmp 的大小
  workspace-size-mb: 64
  tmp-size-mb: 16
  # 容器"保命"时长 = 编译超时 + 运行超时 + 这个余量（秒）
  # 作用：即使执行器进程崩了，容器也会自己退出，不会永久泄漏
  container-lifetime-slack-seconds: 30
  docker:
    # 留空 = 走 DOCKER_HOST 环境变量或默认 socket
    # Linux/macOS: unix:///var/run/docker.sock   Windows: npipe:////./pipe/docker_engine
    host: ""
    connect-timeout-seconds: 10
    # 留得比"最长的一次容器操作"更长
    response-timeout-seconds: 120
    max-connections: 32
  reaper:
    # 定时清理"漏网"的容器（执行器崩了、断电了、killed 了都可能留下）
    enabled: true
    interval-millis: 60000
    # 创建后多久才允许被回收，避免误杀正在跑的容器
    grace-seconds: 120

  # ============================================================
  # 容器预热池
  # ------------------------------------------------------------
  # 池子里放的是"已创建并启动、但从未被使用过"的容器。
  # 用过的容器一律销毁、绝不归还 —— 省的是创建+启动的延迟（实测 300~900ms），
  # 而不是拿"容器跨请求存活"的隔离性去换性能。
  # ============================================================
  pool:
    enabled: true
    # 每种语言预热几个。1 个就能挡掉大部分冷启动
    warm-per-language: 1
    # 预热容器的保活时长。必须比正常请求的保命时长大，
    # 否则容器还没被用上就自己退出了
    warm-keep-alive-seconds: 300
    refill-interval-millis: 5000
    initial-delay-millis: 3000

  # ============================================================
  # 异步任务（POST /api/v1/tasks）
  # ------------------------------------------------------------
  # 和同步接口共用同一个并发名额池，但排队策略不同：
  #   同步：拿不到名额立刻 429（调用方在等结果，快速失败比重试更友好）
  #   异步：排队等待（调用方已拿到 taskId 走了，排队没有体验损失）
  # 关掉之后 /api/v1/tasks 下的接口直接不存在，同步接口不受影响。
  # ============================================================
  async:
    enabled: true
    # 不应小于 max-concurrent-executions，否则并发名额用不满（启动时会告警）
    worker-threads: 4
    # 满了直接拒绝（429），不无限堆积
    queue-capacity: 64
    # 排队等名额的最长时间，超时则任务失败
    max-queue-wait-ms: 60000
    # 任务结果保留多久，过期后查询返回 404
    task-ttl-seconds: 600
    # 保留的任务总数上限，防止堆积吃光内存
    max-retained-tasks: 1000

  # ============================================================
  # API Key 鉴权 —— 默认开启
  # ------------------------------------------------------------
  # 为什么默认开启：执行器持有 Docker socket，等价于宿主机 root。
  # 一个没有鉴权的执行器只要被人访问到，就等于把机器交出去。
  #
  # 没有配置任何 key 时应用会【启动失败】。这是刻意的：
  # 静默地降级成不鉴权，比明显的启动失败危险得多。
  #
  # 配置方式（推荐用环境变量，不要写进这个文件，更不要提交到 git）：
  #     EXECUTOR_AUTH_KEYS_0_NAME=my-app
  #     EXECUTOR_AUTH_KEYS_0_VALUE=<openssl rand -base64 32 生成的串>
  #
  # 只想本地跑着玩：
  #     --executor.auth.enabled=false
  # ============================================================
  auth:
    enabled: true
    header-name: X-API-Key
    # 健康检查必须免鉴权：负载均衡器和容器编排靠它判断实例是否存活，
    # 而它只返回 UP/DOWN，不泄露业务信息。
    public-paths:
      - /actuator/health
    # key 列表留空，全部从环境变量注入。
    # 支持多个 key 是为了让轮换可行：加新 key → 部署 → 切换调用方 → 删旧 key，全程不停机。
    #
    # 每个 key 还能单独配配额（0 = 用下面的全局默认，-1 = 不限）：
    #   EXECUTOR_AUTH_KEYS_0_REQUESTS_PER_MINUTE=30
    #   EXECUTOR_AUTH_KEYS_0_DAILY_QUOTA=2000
    keys: [ ]

  # ============================================================
  # 按调用方的配额
  # ------------------------------------------------------------
  # 全局并发上限保证"执行器不被压垮"；配额保证"某个调用方不把名额吃光"。
  # 只有全局上限时，一个写错循环的调用方能让其他所有人收到 429。
  #
  # 注意：只有【提交执行】消耗配额，查询任务状态不消耗——
  # 否则异步调用方正常轮询几下就把额度用光了。
  # ============================================================
  quota:
    enabled: true
    # 每分钟执行次数上限
    default-requests-per-minute: 60
    # 每日执行次数上限
    default-daily-quota: 5000

management:
  endpoints:
    web:
      exposure:
        # metrics / prometheus 用来做可观测。注意这两个端点也在鉴权范围内
        # （只有 /actuator/health 是免鉴权的），别直接暴露到公网。
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: code-executor
    distribution:
      # 打开直方图，Prometheus 才能算出 P50/P95/P99
      percentiles-histogram:
        code_executor.execution.duration: true

logging:
  level:
    com.chenchen.codeexecutor: INFO
